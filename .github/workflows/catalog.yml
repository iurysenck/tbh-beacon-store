# Regenerates docs/catalog.json whenever a manifest changes.
#
# The public store page is static HTML on GitHub Pages, and a static page cannot list a directory.
# It needs a ready-made index, and that index must never lag behind mods/. Regenerating it here,
# instead of asking contributors to remember it, is what keeps the page and the manifests a single
# source of truth.
#
# No infinite loop: this job writes docs/catalog.json, and the path filter below only triggers on
# mods/**, so its own commit does not re-trigger it.
name: Build catalog

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mods/**"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_catalog.py
      - name: Commit catalog if it changed
        run: |
          if git diff --quiet -- docs/catalog.json; then
            echo "catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          git commit -m "chore: rebuild store catalog from manifests"
          git push
