name: Validate manifests

on:
  pull_request:
    paths:
      - "mods/**"
      - "schema/**"
      - "scripts/validate_manifests.py"
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "schema/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/validate_manifests.py
